var enc=new TextEncoder(),dec=new TextDecoder();
function b64(buf){var s='',a=new Uint8Array(buf);for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
function unb64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function deriveKey(pw,salt){return crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']).then(function(k){return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:150000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])})}
function encryptData(pw,text){var salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  return deriveKey(pw,salt).then(function(k){return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,enc.encode(text))}).then(function(ct){var out=new Uint8Array(28+ct.byteLength);out.set(salt,0);out.set(iv,16);out.set(new Uint8Array(ct),28);return 'ENTC1.'+b64(out)})}
function decryptData(pw,code){var a=unb64(code.trim().replace(/^ENTC1\./,'')),salt=a.slice(0,16),iv=a.slice(16,28),ct=a.slice(28);
  return deriveKey(pw,salt).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:iv},k,ct)}).then(function(b){return dec.decode(b)})}
function sha(t){return crypto.subtle.digest('SHA-256',enc.encode('entcare:'+t)).then(b64)}

/* ---------- pin lock ---------- */
function showPin(mode,done){
  var o=document.createElement('div');o.className='overlay';o.style.zIndex=90;var v='';
  var title=mode==='set'?'নতুন ৪-ডিজিট পিন দিন':mode==='confirm'?'আবার পিন দিন':'পিন দিয়ে আনলক করুন';
  o.innerHTML='<div class="pin"><div class="logo" style="width:56px;height:56px;font-size:16px">ENT</div><div id="pt" style="font-weight:600">'+title+'</div><div class="dots" id="pd"><i></i><i></i><i></i><i></i></div><div class="keys" id="pk">'+[1,2,3,4,5,6,7,8,9,'×',0,'⌫'].map(function(k){return k==='×'&&mode==='unlock'?'<span></span>':'<button data-k="'+k+'" aria-label="'+(k==='⌫'?'মুছুন':k==='×'?'বাতিল':k)+'">'+(k==='×'?'বাতিল':bn(k))+'</button>'}).join('')+'</div></div>';
  $('#app').appendChild(o);
  var first=null;
  function dots(){$$('#pd i',o).forEach(function(d,i){d.classList.toggle('on',i<v.length)})}
  o.addEventListener('click',function(e){var b=e.target.closest('[data-k]');if(!b)return;var k=b.dataset.k;
    if(k==='⌫'){v=v.slice(0,-1);dots();return}
    if(k==='×'){o.remove();done(null);return}
    if(v.length>=4)return;v+=k;dots();
    if(v.length<4)return;
    sha(v).then(function(h){
      if(mode==='unlock'){if(h===db.settings.pin){S.unlocked=true;o.remove();done(true)}else{v='';dots();$('#pt',o).textContent='ভুল পিন, আবার চেষ্টা করুন'}}
      else if(mode==='set'){first=h;v='';dots();mode='confirm';$('#pt',o).textContent='আবার পিন দিন'}
      else{if(h===first){o.remove();done(h)}else{v='';first=null;mode='set';dots();$('#pt',o).textContent='মিলেনি। নতুন পিন দিন'}}
    });
  });
}

document.addEventListener('click',function(e){
  var t=e.target,b;
  if((b=t.closest('[data-tab]'))){S.tab=b.dataset.tab;renderChrome();renderMain();$('#main').scrollTop=0;return}
  if((b=t.closest('[data-f]'))){S.f=b.dataset.f;renderMain();return}
  if((b=t.closest('[data-open]'))){S.detail=b.dataset.open;S.dtab=0;renderDetail();return}
  if(t.closest('[data-close]')){S.detail=null;renderDetail();renderMain();renderChrome();return}
  if(t.closest('#fab')){openForm();return}
  if((b=t.closest('[data-edit]'))){openForm(b.dataset.edit);return}
  if(t.closest('[data-closeform]')){$('#formSheet').remove();return}
  if((b=t.closest('[data-dtab]'))){S.dtab=+b.dataset.dtab;renderDetail();return}
  if((b=t.closest('[data-del]'))){
    if(b.dataset.arm){var id=b.dataset.del;db.patients=db.patients.filter(function(p){return p.id!==id});save();S.detail=null;renderDetail();renderMain();renderChrome();toast('রোগী মুছে ফেলা হয়েছে');return}
    b.dataset.arm='1';b.style.background='var(--danger-bg)';toast('আবার চাপ দিলে মুছে যাবে');setTimeout(function(){if(b){delete b.dataset.arm;b.style.background=''}},3000);return}
  var p=S.detail&&P(S.detail);
  if(p){
    if(t.closest('[data-addlog]')){var n=$('#lognote').value.trim();if(!n)return;p.log.push({date:today(),note:n});save();renderDetail();return}
    if((b=t.closest('[data-dellog]'))){p.log.splice(+b.dataset.dellog,1);save();renderDetail();return}
    if((b=t.closest('[data-delph]'))){p.photos.splice(+b.dataset.delph,1);save();renderDetail();return}
    if(t.closest('[data-addmed]')){var n=$('#mn').value.trim();if(!n){toast('ওষুধের নাম লিখুন');return}p.meds.push({n:n,d:$('#md').value.trim()||'—',days:+$('#mdays').value||1});save();renderDetail();return}
    if((b=t.closest('[data-delmed]'))){p.meds.splice(+b.dataset.delmed,1);save();renderDetail();return}
    if(t.closest('[data-addap]')){var d=$('#ad').value;if(!d){toast('তারিখ দিন');return}p.appts.push({date:d,time:$('#at').value,type:$('#aty').value,st:'পেন্ডিং'});save();renderDetail();renderChrome();return}
    if((b=t.closest('[data-doneap]'))){p.appts[+b.dataset.doneap].st='সম্পন্ন';save();renderDetail();renderChrome();return}
    if((b=t.closest('[data-delap]'))){p.appts.splice(+b.dataset.delap,1);save();renderDetail();renderChrome();return}
  }
  if((b=t.closest('[data-ec]'))){encC=b.dataset.ec;renderMain();return}
  if((b=t.closest('[data-enc]'))){var i=b.dataset.enc;S.openEnc[i]=!S.openEnc[i];b.parentNode.classList.toggle('open',!!S.openEnc[i]);return}
  if(t.closest('#eyeBtn')){db.settings.shield=!db.settings.shield;save();renderChrome();if(S.tab==='set')renderMain();return}
  if(t.closest('#bellBtn')){showAlerts();return}
  if((b=t.closest('[data-tg]'))){
    if(b.dataset.tg==='shield'){db.settings.shield=!db.settings.shield;save();renderChrome();renderMain();}
    else if(db.settings.pin){db.settings.pin=null;save();renderMain();toast('পিন লক বন্ধ করা হয়েছে')}
    else showPin('set',function(h){if(h){db.settings.pin=h;S.unlocked=true;save();renderMain();toast('পিন লক চালু হয়েছে')}});
    return}
  if(t.closest('[data-savesurgeon]')){db.settings.surgeon=$('#sn').value.trim();db.settings.degree=$('#sd').value.trim();save();toast('সংরক্ষিত হয়েছে');return}
  if(t.closest('[data-backup]')){var pw=$('#bp').value;if(pw.length<4){toast('কমপক্ষে ৪ অক্ষরের পাসওয়ার্ড দিন');return}
    encryptData(pw,JSON.stringify(db)).then(function(c){var o=$('#bout');o.hidden=false;o.value=c;$('#bcopy').hidden=false;o.select();toast('ব্যাকআপ কোড তৈরি হয়েছে। কপি করে নিরাপদ জায়গায় রাখুন')}).catch(function(){toast('ব্যাকআপ তৈরি করা যায়নি')});return}
  if(t.closest('[data-copy]')){var o=$('#bout');o.select();var ok=function(){toast('কপি হয়েছে')};try{navigator.clipboard.writeText(o.value).then(ok,function(){document.execCommand('copy')&&ok()})}catch(x){try{document.execCommand('copy')&&ok()}catch(y){}}return}
  if(t.closest('[data-restore]')){var code=$('#rin').value,pw2=$('#rp').value;if(!code||!pw2){toast('কোড ও পাসওয়ার্ড দিন');return}
    decryptData(pw2,code).then(function(txt){var d=JSON.parse(txt);if(!d.patients)throw 0;db=d;save();S.detail=null;renderDetail();renderChrome();renderMain();toast('রিস্টোর সম্পন্ন: '+bn(db.patients.length)+' জন রোগী')}).catch(function(){toast('কোড বা পাসওয়ার্ড ভুল')});return}
  if((b=t.closest('[data-reset]'))){
    if(b.dataset.arm){var keep=db.settings;db=sample();db.settings=keep;save();renderChrome();renderMain();toast('নমুনা ডেটা লোড হয়েছে');return}
    b.dataset.arm='1';b.textContent='নিশ্চিত? আবার চাপুন';setTimeout(function(){b.textContent='নমুনা ডেটায় রিসেট করুন';delete b.dataset.arm},3000);return}
  if(t.closest('[data-alclose]')){var a=$('#alsheet');if(a)a.remove();return}
  if((b=t.closest('[data-alopen]'))){var a=$('#alsheet');if(a)a.remove();S.detail=b.dataset.alopen;S.dtab=3;renderDetail();return}
});
document.addEventListener('input',function(e){
  if(e.target.id==='q'){S.q=e.target.value;renderList()}
  if(e.target.id==='eq'){encQ=e.target.value;renderEncList()}
});
document.addEventListener('change',function(e){
  if(e.target.id==='photo'&&e.target.files[0]){
    var p=P(S.detail),f=e.target.files[0],img=new Image(),rd=new FileReader();
    rd.onload=function(){img.onload=function(){var s=Math.min(1,640/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);p.photos.push(c.toDataURL('image/jpeg',.7));save();renderDetail()};img.src=rd.result};rd.readAsDataURL(f)}
});
document.addEventListener('submit',function(e){
  if(e.target.id!=='pform')return;e.preventDefault();
  var fd=new FormData(e.target),id=e.target.dataset.id,p=id?P(id):{id:uid(),reg:nextReg(),meds:[],appts:[],log:[],photos:[]};
  FIELDS.forEach(function(f){var v=fd.get(f[0]);v=v==null?'':String(v).trim();p[f[0]]=f[0]==='age'?(+v||0):v});
  if(!id){db.patients.push(p);if(p.surgeryDate)p.appts.push({date:p.surgeryDate,time:'09:00',type:p.status==='planned'?'প্রি-অপারেটিভ':'পোস্ট-অপারেটিভ',st:'পেন্ডিং'})}
  save();$('#formSheet').remove();renderDetail();renderMain();renderChrome();toast(id?'তথ্য হালনাগাদ হয়েছে':'নতুন রোগী নিবন্ধিত হয়েছে')
});
function showAlerts(){
  var a=alerts(),o=document.createElement('div');o.id='alsheet';o.className='overlay';o.style.zIndex=40;
  o.innerHTML='<div class="top"><button class="ib" data-alclose aria-label="বন্ধ">'+ic('x')+'</button><h1>নোটিফিকেশন</h1></div><div class="sheetbody">'+(a.length?a.map(function(x){var r=rel(x.a.date);return '<button class="card pc" data-alopen="'+x.p.id+'"><div class="name blur">'+esc(x.p.name)+'</div><div class="sub">'+esc(x.a.type)+' • '+fmt(x.a.date)+' • '+fmtTime(x.a.time)+'</div><div class="due '+(r.late?'late':'')+'" style="margin-top:4px">'+r.t+'</div></button>'}).join(''):'<div class="empty">আগামী ৩ দিনে বা অতিক্রান্ত কোনো অ্যাপয়েন্টমেন্ট নেই।</div>')+'</div>';
  $('#app').appendChild(o);
}

/* ---------- boot ---------- */
function boot(){renderChrome();renderMain()}
if(db.settings.pin&&!S.unlocked){boot();showPin('unlock',function(){})}else boot();
})();
</script>
<script>if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
